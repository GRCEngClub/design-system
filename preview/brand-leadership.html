<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Leadership</title><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 16px; background: var(--bg-page); }
  .leadership { display:grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .person img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; border: 1px solid var(--border-default); display:block; }
  .person .nm { color: var(--fg-1); font-weight: 500; font-size: 13px; margin-top: 8px; }
  .person .role { color: var(--fg-3); font-size: 12px; margin-top: 2px; }
</style></head><body>
<div class="leadership">
  <div class="person"><img src="../assets/leadership/aj.jpeg" alt=""><div class="nm">AJ Yawn</div><div class="role">Founder</div></div>
  <div class="person"><img src="../assets/leadership/abdie.jpeg" alt=""><div class="nm">Abdie Mohamed</div><div class="role">President</div></div>
  <div class="person"><img src="../assets/leadership/ashley.jpeg" alt=""><div class="nm">Ashley</div><div class="role">Leadership team</div></div>
  <div class="person"><img src="../assets/leadership/ethan.jpeg" alt=""><div class="nm">Ethan Troy</div><div class="role">Leadership team</div></div>
  <div class="person"><img src="../assets/leadership/jr.jpeg" alt=""><div class="nm">J-R</div><div class="role">Leadership team</div></div>
</div>
</body></html>
