<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Logo</title><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 18px; background: var(--bg-page); display:flex; gap: 40px; align-items:center; }
  .mark { display:flex; align-items:center; gap:14px; }
  .mark img { width: 72px; height: 72px; border-radius: 12px; display:block; }
  .name { color: var(--fg-1); font-weight: 500; font-size: 22px; letter-spacing: -.02em; line-height: 1.1; }
  .nav { display:flex; align-items:center; gap:12px; }
  .nav img { width: 40px; height: 40px; border-radius: 8px; display:block; }
  .nav span { color: var(--fg-1); font-size: 18px; font-weight: 500; }
  .meta { margin-top: 6px; }
</style></head><body>
<div class="mark">
  <img src="../assets/logo.jpeg" alt="GRC Engineering Club">
  <div>
    <div class="name">GRC Engineering Club</div>
    <div class="meta">logo.jpeg · one weight, no orange word</div>
  </div>
</div>
<div>
  <div class="nav"><img src="../assets/logo.jpeg" alt=""><span>GRC Engineering Club</span></div>
  <div class="meta">nav lockup · 40px mark, rounded-lg, 18px/500</div>
</div>
</body></html>
