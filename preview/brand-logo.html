<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 18px; background: var(--bg-page); display:flex; gap: 16px; align-items:center; }
  .mark { display:flex; align-items:center; gap:14px; }
  .mark img { width: 80px; height: 80px; border-radius: 12px; }
  .name { color:#fff; font-weight: 900; font-size: 22px; letter-spacing: -.01em; line-height: 1.05; }
  .name span { color: var(--fg-accent); }
  .tag { color: var(--fg-3); font-size: 11px; margin-top: 4px; font-family: var(--font-mono); }
</style></head><body>
<div class="mark">
  <img src="../assets/logo.jpeg" alt="GRC Engineering Club">
  <div>
    <div class="name">GRC Engineering<br><span>Club</span></div>
    <div class="tag">logo.jpeg · 80×80 · rounded-lg</div>
  </div>
</div>
</body></html>
