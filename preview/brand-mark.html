<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 0; background: #000; }
  .wrap { display:flex; gap: 0; align-items: stretch; height: 200px; }
  .img { flex: 1; }
  .img img { width: 100%; height: 100%; object-fit: cover; }
  .meta { flex: 1; padding: 18px; color: var(--fg-2); display:flex; flex-direction:column; justify-content:center; }
  .meta h3 { margin: 0 0 6px; color: #fff; font-size: 14px; font-weight: 800; letter-spacing: -.01em; }
  .meta p { margin: 0; font-size: 11.5px; color: var(--fg-3); line-height: 1.55; }
  .eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--fg-accent); font-weight: 700; margin-bottom: 6px; }
</style></head><body>
<div class="wrap">
  <div class="img"><img src="../assets/brand-mark-orange.jpg" alt=""></div>
  <div class="meta">
    <div class="eyebrow">Brand Mark · Hero Asset</div>
    <h3>Glowing orange iconography on near-black</h3>
    <p>Use sparingly for hero / cover / about. Imagery: shield, gears, gavel, code-tags, clipboards. The most "expressive" the brand goes visually.</p>
  </div>
</div>
</body></html>
