<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Brand mark</title><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 0; background: var(--bg-page); }
  .wrap { display:flex; gap: 0; align-items: stretch; height: 200px; }
  .img { flex: 1; }
  .img img { width: 100%; height: 100%; object-fit: cover; display:block; }
  .copy { flex: 1; padding: 20px 24px; display:flex; flex-direction:column; justify-content:center; }
  .copy h3 { margin: 8px 0 6px; font-size: 16px; }
  .copy p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--fg-2); }
</style></head><body>
<div class="wrap">
  <div class="img"><img src="../assets/brand-mark-orange.jpg" alt=""></div>
  <div class="copy">
    <div class="meta">Brand mark · photographic asset</div>
    <h3>Orange line iconography on near-black</h3>
    <p>A picture, not a UI treatment. Use it once, for a cover, an about page or a social frame. The interface itself never glows: no orange shadows, washes or gradients around it.</p>
  </div>
</div>
</body></html>
