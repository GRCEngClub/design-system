<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 16px; background: var(--bg-page); }
  .grid { display:grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
  .card { background: var(--bg-card); border: 1px solid var(--border-default); border-radius: 12px; overflow: hidden; }
  .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display:block; background: #fff; }
  .label { padding: 8px 10px; font-size: 10.5px; color: var(--fg-3); font-weight: 600; }
</style></head><body>
<div class="grid">
  <div class="card"><img src="../assets/merch/run-grc-tee-black.jpg"><div class="label">Run GRC Tee</div></div>
  <div class="card"><img src="../assets/merch/anti-checkbox-tee.jpg"><div class="label">Anti-Checkbox</div></div>
  <div class="card"><img src="../assets/merch/run-grc-mug.jpg"><div class="label">Run GRC Mug</div></div>
  <div class="card"><img src="../assets/merch/engineered-not-documented.jpg"><div class="label">Engineered, Not Documented</div></div>
</div>
</body></html>
