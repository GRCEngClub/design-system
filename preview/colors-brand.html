<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: var(--bg-page); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .sw { aspect-ratio: 1.6/1; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--border-default); }
  .name { font-size: 11px; font-weight: 700; color: var(--fg-1); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: rgba(255,255,255,0.7); }
  .dark .hex, .dark .name { color: var(--fg-2); }
</style></head><body>
<div class="grid">
  <div class="sw" style="background:#E8650A"><div class="name">Orange</div><div class="hex">#E8650A</div></div>
  <div class="sw" style="background:#FF8533"><div class="name">Orange Light</div><div class="hex">#FF8533</div></div>
  <div class="sw" style="background:#C45200"><div class="name">Orange Dark</div><div class="hex">#C45200</div></div>
  <div class="sw" style="background:rgba(232,101,10,.10); border-color: rgba(232,101,10,.4)"><div class="name" style="color:#FF8533">Orange/10</div><div class="hex" style="color:#FF8533">tint</div></div>
  <div class="sw" style="background:rgba(232,101,10,.20); border-color: rgba(232,101,10,.5)"><div class="name" style="color:#FF8533">Orange/20</div><div class="hex" style="color:#FF8533">chip bg</div></div>
</div>
</body></html>
