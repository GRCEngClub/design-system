<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 18px; background: var(--bg-page); }
  .row { display:flex; gap:12px; align-items:center; padding: 8px 12px; border-bottom: 1px solid var(--border-subtle); }
  .row:last-child { border:0; }
  .swatch { width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0; border: 1px solid var(--border-subtle); }
  .label { flex: 1; }
  .name { color: var(--fg-1); font-weight: 700; font-size: 13px; }
  .var { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style></head><body>
<div class="row"><div class="swatch" style="background:#FFFFFF"></div><div class="label"><div class="name">Foreground 1 · Hi-emphasis</div><div class="var">--fg-1 / text-white</div></div><div class="hex">#FFFFFF</div></div>
<div class="row"><div class="swatch" style="background:#F5F5F5"></div><div class="label"><div class="name">Foreground 2 · Body</div><div class="var">--fg-2 / text-brand-text</div></div><div class="hex">#F5F5F5</div></div>
<div class="row"><div class="swatch" style="background:#A0A0A0"></div><div class="label"><div class="name">Foreground 3 · Muted</div><div class="var">--fg-3 / text-brand-text-muted</div></div><div class="hex">#A0A0A0</div></div>
<div class="row"><div class="swatch" style="background:#E8650A"></div><div class="label"><div class="name">Foreground Accent · Brand</div><div class="var">--fg-accent / text-brand-orange</div></div><div class="hex">#E8650A</div></div>
</body></html>
