<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Graphite ramp</title><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: var(--bg-page); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .sw { aspect-ratio: 1.5/1; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--border-default); }
  .name { font-size: 13px; font-weight: 500; color: var(--fg-1); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .hex b { font-weight: 400; color: var(--fg-2); display:block; }
  .light { margin-top: 12px; display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .light .sw { aspect-ratio: auto; padding: 8px 10px; border-color:#E5E5E5; }
  .light .name { color:#171717; font-size: 12px; }
  .light .hex { color:#737373; }
</style></head><body>
<div class="grid">
  <div class="sw" style="background:#111110"><div class="name">Page</div><div class="hex"><b>#111110</b>bg-brand-dark</div></div>
  <div class="sw" style="background:#161514"><div class="name">Alt section</div><div class="hex"><b>#161514</b>bg-brand-dark-alt</div></div>
  <div class="sw" style="background:#1C1B19"><div class="name">Card</div><div class="hex"><b>#1C1B19</b>bg-brand-gray</div></div>
  <div class="sw" style="background:#2B2925"><div class="name">Raised · hairline · chip</div><div class="hex"><b>#2B2925</b>bg-brand-gray-light</div></div>
</div>
<div class="light">
  <div class="sw" style="background:#FFFFFF"><div class="name">Light page</div><div class="hex">#FFFFFF</div></div>
  <div class="sw" style="background:#F5F5F5"><div class="name">Light alt</div><div class="hex">#F5F5F5</div></div>
  <div class="sw" style="background:#FFFFFF"><div class="name" style="color:#525252">Body #525252</div><div class="hex">meta #737373</div></div>
  <div class="sw" style="background:#FFFFFF"><div class="name">Headings</div><div class="hex">#171717 · border #E5E5E5</div></div>
</div>
</body></html>
