<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: #555; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .sw { aspect-ratio: 1.6/1; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--border-default); }
  .name { font-size: 11px; font-weight: 700; color: var(--fg-1); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: rgba(255,255,255,0.65); }
</style></head><body>
<div class="grid">
  <div class="sw" style="background:#0D0D0D"><div class="name">Dark</div><div class="hex">#0D0D0D · page</div></div>
  <div class="sw" style="background:#1A1A1A"><div class="name">Dark Alt</div><div class="hex">#1A1A1A · alt section</div></div>
  <div class="sw" style="background:#2A2A2A"><div class="name">Gray</div><div class="hex">#2A2A2A · card</div></div>
  <div class="sw" style="background:#3A3A3A"><div class="name">Gray Light</div><div class="hex">#3A3A3A · border</div></div>
</div>
</body></html>
