<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Buttons</title><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 20px 22px; background: var(--bg-page); display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; align-items:start; }
  .col { display:flex; flex-direction:column; gap: 12px; align-items:flex-start; }
  .col .meta { margin-bottom: 2px; }
  .press { transform: scale(.98); }
</style></head><body>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<div class="col">
  <span class="meta">Primary · orange fill, dark text, no shadow</span>
  <button class="btn btn-primary btn-lg">Join the Club</button>
  <button class="btn btn-primary">Join the Club</button>
  <button class="btn btn-primary btn-sm">Join the Club</button>
</div>
<div class="col">
  <span class="meta">Secondary · raised surface, hairline</span>
  <button class="btn btn-secondary btn-lg">See what you get</button>
  <button class="btn btn-secondary">See what you get</button>
  <button class="btn btn-secondary btn-sm">Browse catalog</button>
</div>
<div class="col">
  <span class="meta">Quiet text link, and the press state</span>
  <a class="link" href="#">See all member stories <i data-lucide="arrow-right" style="width:16px;height:16px"></i></a>
  <a class="link" href="#">Exam readiness</a>
  <button class="btn btn-primary press">Pressed · scale .98</button>
</div>
<script>lucide.createIcons();</script>
</body></html>
