<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 22px; background: var(--bg-page); display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  .btn { display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; padding: 10px 18px; border-radius: 8px; cursor:pointer; transition: all 200ms ease; border: 0; gap:6px; }
  .btn.primary { background: var(--grc-orange); color:#fff; box-shadow: var(--shadow-cta); }
  .btn.primary:hover { background: var(--grc-orange-light); box-shadow: var(--shadow-cta-hover); }
  .btn.secondary { background: transparent; color: var(--grc-orange); border: 2px solid var(--grc-orange); padding: 8px 16px; }
  .btn.secondary:hover { background: var(--grc-orange); color:#fff; }
  .btn.lg { padding: 14px 28px; font-size:16px; }
  .btn.sm { padding: 7px 14px; font-size:12px; }
</style></head><body>
<button class="btn primary lg">Join the Club</button>
<button class="btn primary">Join the Club</button>
<button class="btn primary sm">Join</button>
<button class="btn secondary">See What You Get →</button>
<button class="btn secondary sm">Learn More</button>
</body></html>
