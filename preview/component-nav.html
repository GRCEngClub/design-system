<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 0; background: var(--bg-page); }
  .banner { background: #f97316; color:#fff; padding: 8px 16px; display:flex; justify-content:center; align-items:center; gap:10px; font-size: 12px; }
  .banner b { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
  .nav { background: rgba(13,13,13,.95); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(58,58,58,.5); padding: 12px 20px; display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand img { width:32px; height:32px; border-radius:8px; }
  .brand span { color:#fff; font-weight:700; font-size: 14px; }
  .links { display:flex; gap:18px; align-items:center; }
  .links a { color: var(--fg-3); font-size: 12.5px; font-weight: 500; text-decoration:none; }
  .links a.cta { background: var(--grc-orange); color:#fff; padding: 8px 14px; border-radius:8px; font-weight:700; }
</style></head><body>
<div class="banner"><b>Member Reviews</b><span style="opacity:.6">|</span><span>"This community shows up every time" — Princess Okoro</span></div>
<div class="nav">
  <div class="brand"><img src="../assets/logo.jpeg" alt=""><span>GRC Engineering Club</span></div>
  <div class="links">
    <a>Academy</a><a>Learn ▾</a><a>Community ▾</a><a>About ▾</a><a>Merch</a>
    <a class="cta">Join the Club</a>
  </div>
</div>
</body></html>
