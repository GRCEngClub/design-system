<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Stats</title><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 18px; background: var(--bg-page); display:grid; grid-template-columns: repeat(3,1fr); gap:12px; }
  .stat { padding: 16px 18px; }
  .num { color: var(--fg-1); font-weight: 500; font-size: 32px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 10px; }
  .num.lead { color: var(--fg-accent-text); }
  .change { color: var(--fg-2); font-size: 13px; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .change b { font-weight: 500; color: var(--fg-1); }
</style></head><body>
<div class="card stat"><div class="meta">Members</div><div class="num">424</div><div class="change"><b>+12%</b> vs last month</div></div>
<div class="card stat"><div class="meta">Chapters</div><div class="num lead">31</div><div class="change"><b>+4</b> since September</div></div>
<div class="card stat"><div class="meta">CGE-P passing score</div><div class="num">72%</div><div class="change">43 of 60 questions</div></div>
</body></html>
