<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 18px; background: var(--bg-page); display:grid; grid-template-columns: repeat(4,1fr); gap:10px; }
  .stat { background: var(--bg-card); border: 1px solid var(--border-default); border-radius: 12px; padding: 16px; text-align: center; }
  .num { color: var(--fg-accent); font-weight: 900; font-size: 28px; line-height: 1; letter-spacing: -.02em; }
  .lbl { color: var(--fg-3); font-size: 11px; margin-top: 6px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
</style></head><body>
<div class="stat"><div class="num">$330K</div><div class="lbl">Top verified salary</div></div>
<div class="stat"><div class="num">424+</div><div class="lbl">Members</div></div>
<div class="stat"><div class="num">70k+</div><div class="lbl">LinkedIn reach</div></div>
<div class="stat"><div class="num">72%</div><div class="lbl">CGE-P passing score</div></div>
</body></html>
