<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>

  .qmark { color: var(--fg-accent); margin-bottom: 8px; }

  .name { color: #fff; font-weight: 700; font-size: 13px; margin: 0; }
  .title { color: var(--fg-3); font-size: 11.5px; margin: 2px 0 0; }
