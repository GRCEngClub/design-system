<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Story card</title><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 16px; background: var(--bg-page); }
  .quote { color: var(--fg-1); font-size: 15px; line-height: 1.6; margin: 0 0 20px; }
  .foot { border-top: 1px solid var(--border-default); padding-top: 14px; }
  .title { color: var(--fg-2); font-weight: 500; font-size: 14px; margin: 0; }
  .name { color: var(--fg-3); font-size: 14px; margin: 2px 0 0; }
</style></head><body>
<div class="card">
  <p class="quote">&ldquo;The work works. Put in the reps, stay consistent, and the results show up. I'm living proof.&rdquo;</p>
  <div class="foot">
    <p class="title">GRC Program Analyst at Compyl</p>
    <p class="name">James Robinson (J-R) · January 2026</p>
  </div>
</div>
</body></html>
