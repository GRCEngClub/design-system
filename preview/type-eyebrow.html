<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 24px; background: var(--bg-page); display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--fg-accent); background:rgba(232,101,10,.10); padding: 6px 12px; border-radius:9999px; }
  .chip.outline { background:transparent; border:1px solid var(--fg-accent); }
  .chip.solid { background:var(--fg-accent); color:#fff; }
</style></head><body>
<span class="chip">Most Popular</span>
<span class="chip">Launching April 2026</span>
<span class="chip outline">Recommended</span>
<span class="chip solid">Live</span>
<span class="chip">Short</span>
<span class="chip">Full Episode</span>
</body></html>
