<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GRC Eng Academy — Cert Platform UI Kit</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    // Mirrors cert-platform/frontend/tailwind.config.js (2026-11-01). Production is the source of truth.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#E8650A',
              'orange-light': '#FF8533',
              'orange-dark': '#C45200',
              dark: '#111110',
              'dark-alt': '#161514',
              gray: '#1C1B19',
              'gray-light': '#2B2925',
              text: '#EFE9DE',
              'text-muted': '#AAA398',
              'text-dim': '#8A847A',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SF Mono', 'Menlo', 'Consolas', 'monospace'],
          },
        },
      },
    };
  </script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <style>
    html, body { margin: 0; background: #111110; color: #EFE9DE; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; }
    i[data-lucide] { display: inline-block; flex: none; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./Components.jsx"></script>
<script type="text/babel" src="./Pages.jsx"></script>
<script type="text/babel">
  const { useState, useEffect } = React;

  function App() {
    const KEY = 'grc-certplatform-route';
    const [route, setRoute] = useState(() => localStorage.getItem(KEY) || 'dashboard');
    const go = (r) => { setRoute(r); localStorage.setItem(KEY, r); window.scrollTo(0, 0); };
    useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [route]);

    let page;
    if (route === 'dashboard') page = <Dashboard go={go} />;
    else if (route === 'course') page = <CourseOutline go={go} />;
    else if (route === 'lesson') page = <LessonPlayer go={go} />;
    else if (route === 'labs') page = <LabsPage />;
    else if (route === 'exam') page = <ExamPage />;

    return (
      <div data-screen-label={`Academy · ${route}`} className="min-h-screen bg-brand-dark font-sans text-brand-text">
        <AcademyNav current={route === 'lesson' ? 'course' : route} go={go} />
        <main>{page}</main>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
