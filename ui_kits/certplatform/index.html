<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GRC Eng Academy — Cert Platform UI Kit</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html, body { margin: 0; background: #0D0D0D; color: #F5F5F5; font-family: 'Inter', system-ui, sans-serif; }
    button { font-family: inherit; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./Components.jsx"></script>
<script type="text/babel" src="./Pages.jsx"></script>
<script type="text/babel">
  const { useState, useEffect } = React;

  function App() {
    const KEY = 'grc-certplatform-route';
    const [route, setRoute] = useState(() => localStorage.getItem(KEY) || 'dashboard');
    const go = (r) => { setRoute(r); localStorage.setItem(KEY, r); window.scrollTo(0, 0); };
    useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [route]);

    let page;
    if (route === 'dashboard') page = <Dashboard go={go} />;
    else if (route === 'course') page = <CourseOutline go={go} />;
    else if (route === 'lesson') page = <LessonPlayer go={go} />;
    else if (route === 'labs') page = <LabsPage />;
    else if (route === 'exam') page = <ExamPage />;

    return (
      <div data-screen-label={`Academy · ${route}`}>
        <AcademyNav current={route === 'lesson' ? 'course' : route} go={go} />
        <main>{page}</main>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
